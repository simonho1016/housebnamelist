<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@page{size:A4 portrait;margin:0}
@media print{html,body{margin:0!important;padding:0!important;background:#fff!important}
 body>.print-record{display:block!important;width:210mm;height:auto;overflow:visible}
 .print-record img{display:block;width:210mm;height:297mm;object-fit:contain;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .print-page{break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}}
.print-record{display:none}
body.printing-record>.print-record{display:block}
</style></head>
<body class="printing-record">
<div class="print-record" id="printRecord"></div>
<script>
sessionStorage.setItem('cyc-portal-auth',JSON.stringify({p:'testpass',exp:Date.now()+15*60*1000}));
sessionStorage.setItem('dorm-duty-dorm','hau');sessionStorage.setItem('dorm-duty-unlocked','1');
sessionStorage.setItem('dorm-duty-passcode','testpass');sessionStorage.setItem('dorm-duty-auth-exp',String(Date.now()+15*60*1000));
const f=document.createElement('iframe');f.style.cssText='width:1px;height:1px;position:absolute;left:-99px';f.src='/duties/?cb=pp';
f.onload=()=>setTimeout(async()=>{
 const w=f.contentWindow;
 w.print=()=>{};
 await w.eval(`(async()=>{
  state.statuses=Object.fromEntries(ALL.map(id=>[id,'normal']));state.active=[...ALL];
  const snap={...clone(state),config:configuration()};
  snap.round={entries:state.active.map((id,i)=>({id,job:i%JOBS.length,revealed:true})),rungs:[],cardOrder:[...state.active],ladderOrder:[...state.active],created:new Date().toISOString(),last:null};
  await printRecordSheet({id:'duty-p',dorm:DORM_ID,title:'測試',savedAt:new Date().toISOString(),reason:'manual',snapshot:snap});
 })()`);
 const src=w.eval("$('printRecord').innerHTML");
 document.getElementById('printRecord').innerHTML=src;
 await Promise.all([...document.querySelectorAll('#printRecord img')].map(img=>img.decode().catch(()=>{})));
 document.title='READY';
},700);
document.body.appendChild(f);
</script></body></html>
