<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香港扶幼會則仁中心 忠孝宿舍服務</title>
<meta name="description" content="則仁中心忠孝宿舍服務入口：舍務抽籤及舍友名單。登入後 15 分鐘自動登出。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  :root{
    /* 舍友名單（漫畫風選擇畫面） */
    --paper:#fffdf6; --dot:#dde3ea; --ink:#111; --yellow:#fde047;
    --muted:#6b7280; --sub:#374151;
    /* 舍務抽籤（綠色主題） */
    --green:#075e4e; --green-dark:#034436; --mint:#e9f4ef; --duty-yellow:#f6d566;
    /* 兩社代表色 */
    --zhong:#ffe4e6; --xiao:#dbeafe;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background-color:var(--paper);
    background-image:radial-gradient(var(--dot) 1.2px,transparent 1.6px);
    background-size:10px 10px;
    color:var(--ink);
    font-family:"Huninn","PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  }
  .box{text-align:center;max-width:760px;width:100%}
  .org{margin:0 0 18px;font-size:20px;letter-spacing:.14em}
  .title{
    display:inline-block;margin:0;padding:8px 36px;background:var(--yellow);color:var(--ink);
    border:3px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);
    transform:rotate(-1.2deg);font-size:32px;font-weight:400;letter-spacing:.12em;
  }
  .sub{color:var(--sub);font-size:17px;margin:22px 0 26px}

  /* ── 登入閘 ───────────────────────────── */
  .lock{
    max-width:420px;margin:0 auto;padding:28px 26px;background:#fff;
    border:3px solid var(--ink);border-radius:16px;box-shadow:7px 7px 0 var(--ink);
    background-image:radial-gradient(rgba(0,0,0,.05) 1.1px,transparent 1.5px);background-size:8px 8px;
  }
  .lock-icon{
    width:64px;height:64px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    font-size:32px;background:var(--mint);border:3px solid var(--ink);border-radius:14px;
    box-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg);
  }
  .lock p{margin:0 0 16px;font-size:15px;color:var(--sub);line-height:1.6}
  .lock-row{display:flex;gap:10px}
  .lock input{
    flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 14px;
    border:3px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);
  }
  .lock input:focus-visible{outline:3px solid #b07500;outline-offset:2px}
  .btn{
    font:inherit;cursor:pointer;border:3px solid var(--ink);border-radius:10px;
    padding:10px 20px;background:var(--yellow);color:var(--ink);
    box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:4px 4px 0 var(--ink)}
  .btn.green{background:var(--green);color:#fff}
  .lock-msg{min-height:22px;margin:12px 0 0;font-size:14px;color:#b91c1c}
  .lock-skip{margin:10px 0 0;font-size:13px}
  .lock-skip button{border:0;background:none;padding:0;color:#2563eb;text-decoration:underline;font:inherit;cursor:pointer}

  /* ── 功能卡 ───────────────────────────── */
  .session-bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    margin:0 0 20px;font-size:14px;color:var(--sub);
  }
  .session-bar .pill{
    padding:5px 14px;background:var(--mint);color:var(--green);
    border:2px solid var(--ink);border-radius:999px;box-shadow:2px 2px 0 var(--ink);
  }
  .session-bar .logout{
    font:inherit;font-size:13px;padding:5px 14px;background:#fff;color:var(--sub);
    border:2px solid var(--ink);border-radius:999px;box-shadow:2px 2px 0 var(--ink);cursor:pointer;
  }
  .session-bar .logout:hover{background:#f3f4f6}

  .cards{display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
  .card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    width:260px;min-height:220px;padding:20px 16px;
    border:3px solid var(--ink);border-radius:16px;box-shadow:7px 7px 0 var(--ink);
    text-decoration:none;color:var(--ink);
    background-image:radial-gradient(rgba(0,0,0,.07) 1.1px,transparent 1.5px);
    background-size:8px 8px;
    transition:transform .08s,box-shadow .08s;
  }
  .card:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--ink)}
  .card:active{transform:translate(4px,4px);box-shadow:3px 3px 0 var(--ink)}
  .card:focus-visible{outline:3px solid #b07500;outline-offset:4px}
  .card-name{font-size:26px;letter-spacing:.1em}
  .card-desc{font-size:14px;color:var(--sub);line-height:1.5}
  .card-url{font-size:12px;color:var(--muted);letter-spacing:.03em}

  /* 舍務抽籤卡：綠色主題 + 品牌點陣標記 */
  .card-duty{background-color:var(--mint)}
  .brandmark{
    display:grid;grid-template-columns:repeat(2,10px);gap:6px;padding:16px;
    background:var(--green);border-radius:16px;transform:rotate(-7deg);
    border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  }
  .brandmark i{width:10px;height:10px;border-radius:50%;background:var(--duty-yellow)}

  /* 舍友名單卡：忠孝雙社床位標記 */
  .card-roster{background-color:#fff}
  .beds{display:flex;gap:12px}
  .bed{
    width:64px;height:64px;display:flex;align-items:center;justify-content:center;
    font-size:34px;line-height:1;border:3px solid var(--ink);border-radius:12px;
    box-shadow:3px 3px 0 var(--ink);
    background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1.4px);background-size:7px 7px;
  }
  .bed.zhong{background-color:var(--zhong);transform:rotate(-2deg)}
  .bed.xiao{background-color:var(--xiao);transform:rotate(2deg)}

  .note{margin-top:28px;font-size:13px;color:var(--muted)}
  .foot{margin-top:10px;font-size:13px;color:var(--muted)}

  @media (max-width:520px){
    .title{font-size:26px;padding:8px 22px}
    .org{font-size:17px}
    .card{width:100%;max-width:320px}
    .lock-row{flex-direction:column}
  }
</style>
</head>
<body>
  <main class="box">
    <p class="org">香港扶幼會則仁中心</p>
    <h1 class="title">忠孝宿舍服務</h1>

    <!-- 登入閘：密碼統一在此輸入 -->
    <section class="lock" id="lockView" hidden>
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <p>舍務抽籤及舍友名單載有舍友個人資料，只供獲授權的職員使用。<br>請輸入共用密碼；登入後 <strong>15 分鐘</strong>會自動登出。</p>
      <form class="lock-row" id="lockForm">
        <input type="password" id="lockInput" autocomplete="current-password" placeholder="共用密碼" maxlength="200" aria-label="共用密碼">
        <button type="submit" class="btn green" id="lockGo">進入</button>
      </form>
      <p class="lock-msg" id="lockMsg" role="status"></p>
      <p class="lock-skip" id="lockSkip" hidden>未能連線驗證。<button type="button" id="lockSkipBtn">略過驗證直接進入</button>（密碼錯誤時各系統會要求重新登入）</p>
    </section>

    <!-- 功能選擇（登入後顯示） -->
    <section id="mainView" hidden>
      <div class="session-bar">
        <span class="pill" id="sessionPill">已登入</span>
        <button type="button" class="logout" id="logoutBtn">登出</button>
      </div>
      <p class="sub">請選擇要開啟的功能</p>

      <div class="cards">
        <a class="card card-duty" href="/duties/" data-url="/duties/">
          <span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="card-name">舍務抽籤</span>
          <span class="card-desc">每星期抽一次，大家一齊做。<br>抽籤結果自動記錄上雲端。</span>
          <span class="card-url">/duties/</span>
        </a>

        <a class="card card-roster" href="/roster/" data-url="/roster/">
          <span class="beds" aria-hidden="true">
            <span class="bed zhong">忠</span>
            <span class="bed xiao">孝</span>
          </span>
          <span class="card-name">舍友名單</span>
          <span class="card-desc">忠社・孝社床位名單，<br>任何裝置即時同步，可列印張貼。</span>
          <span class="card-url">/roster/</span>
        </a>
      </div>

      <p class="note">兩個系統各自獨立運作，資料均儲存於雲端。</p>
    </section>

    <p class="foot">創作者：何文諾社工（香港扶幼會則仁中心）</p>
  </main>

<script>
'use strict';
// ── 統一登入：密碼只在此頁輸入，經網址 hash 帶到各系統（不會送上伺服器），15 分鐘後自動登出 ──
const AUTH_SESSION_KEY = 'cyc-portal-auth', AUTH_TTL = 15 * 60 * 1000;
const ROSTER_API = '/api/roster?house=xiao';
const DUTY_VERIFY = 'https://pkziogchjqgcvezmeteq.supabase.co/rest/v1/rpc/duty_records_verify';
const DUTY_KEY = 'sb_publishable_GiDTfksX6FnyKGokiIjulQ_IJbtGIH1';

const $ = id => document.getElementById(id);

function portalAuth() {
  try {
    const a = JSON.parse(sessionStorage.getItem(AUTH_SESSION_KEY));
    if (a && typeof a.p === 'string' && a.p && Number.isFinite(a.exp)) {
      if (Date.now() < a.exp) return a;
      sessionStorage.removeItem(AUTH_SESSION_KEY);
    }
  } catch (e) {}
  return null;
}
function portalLogin(p) {
  try { sessionStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({ p, exp: Date.now() + AUTH_TTL })); } catch (e) {}
}
function portalLogout() {
  try { sessionStorage.removeItem(AUTH_SESSION_KEY); } catch (e) {}
}

function showLock(msg) {
  $('mainView').hidden = true;
  $('lockView').hidden = false;
  $('lockMsg').textContent = msg || '';
  $('lockSkip').hidden = true;
  $('lockInput').focus();
}
function showMain() {
  $('lockView').hidden = true;
  $('mainView').hidden = false;
  tickSession();
}
function tickSession() {
  const a = portalAuth();
  if (!a) { showLock('登入已過期（15 分鐘），請重新輸入密碼。'); return; }
  const mins = Math.max(1, Math.ceil((a.exp - Date.now()) / 60000));
  const until = new Date(a.exp).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
  $('sessionPill').textContent = `已登入 · ${until} 自動登出（約 ${mins} 分鐘）`;
}
setInterval(tickSession, 15000);

// 驗證密碼：先試舍友名單 API（GET 讀取），網絡失敗再試舍務抽籤的驗證 RPC
async function verifyPassword(p) {
  try {
    const res = await fetch(ROSTER_API, {
      cache: 'no-store',
      headers: { 'x-roster-key': encodeURIComponent(p) },
    });
    if (res.status === 401) return 'wrong';
    if (res.ok) return 'ok';
  } catch (e) { /* 網絡或 CORS 問題，試下一個 */ }
  try {
    const res = await fetch(DUTY_VERIFY, {
      method: 'POST',
      headers: { apikey: DUTY_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_passcode: p }),
      cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer',
    });
    if (res.status === 401 || res.status === 403) return 'wrong';
    if (res.ok) return 'ok';
  } catch (e) { /* 仍未能連線 */ }
  return 'unknown';
}

let lastTry = '';
$('lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const p = $('lockInput').value.trim();
  if (!p) { $('lockMsg').textContent = '請先輸入密碼。'; return; }
  lastTry = p;
  $('lockGo').disabled = true;
  $('lockMsg').textContent = '正在驗證…';
  $('lockSkip').hidden = true;
  const outcome = await verifyPassword(p);
  $('lockGo').disabled = false;
  if (outcome === 'ok') {
    portalLogin(p);
    $('lockInput').value = '';
    showMain();
  } else if (outcome === 'wrong') {
    $('lockMsg').textContent = '密碼不正確，請再試一次。';
  } else {
    $('lockMsg').textContent = '未能連線驗證密碼，請檢查網絡。';
    $('lockSkip').hidden = false;
  }
});
$('lockSkipBtn').addEventListener('click', () => {
  if (!lastTry) return;
  portalLogin(lastTry);
  $('lockInput').value = '';
  showMain();
});
$('logoutBtn').addEventListener('click', () => {
  portalLogout();
  showLock('已登出。');
});

// 進入各系統時，把密碼及進入時間附加在網址 hash（只留在瀏覽器，不會送上伺服器）
document.querySelectorAll('.card[data-url]').forEach(card => {
  card.addEventListener('click', e => {
    const a = portalAuth();
    if (!a) { e.preventDefault(); showLock('登入已過期（15 分鐘），請重新輸入密碼。'); return; }
    e.preventDefault();
    location.href = card.dataset.url + '#key=' + encodeURIComponent(a.p) + '&t=' + Date.now();
  });
});

// 開啟時：已有有效登入就直接顯示功能頁
if (portalAuth()) showMain(); else showLock('');
</script>
</body>
</html>
