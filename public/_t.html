<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>e2e</title></head>
<body>
<pre id="log">running…</pre>
<script>
const log = [];
const P = m => { log.push(m); document.getElementById('log').textContent = log.join('\n'); };
sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'test', exp: Date.now() + 900000 }));
function loadFrame(src){
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:390px;height:700px;';   // 模擬手機直向尺寸
    f.src = src;
    f.onload = () => setTimeout(() => res(f), 2500);
    document.body.appendChild(f);
  });
}
(async () => {
  try {
    const fa = await loadFrame('/apply/');
    const wa = fa.contentWindow;
    P('== SIGN PAD ==');
    P('lockLandscape/unlockLandscape: ' + typeof wa.eval('lockLandscape') + '/' + typeof wa.eval('unlockLandscape'));
    P('no aspect-ratio lock: ' + !wa.document.querySelector('#signModal [style*="aspect-ratio"]'));
    P('fullscreen overlay: ' + !!wa.document.querySelector('#signModal > div.absolute.inset-0.bg-white.flex.flex-col'));
    // 開簽名板，度 canvas 係咪佔滿成個畫面（減頂部按鈕行）
    const p = wa.eval("openSignPad('測試')");
    await new Promise(r => setTimeout(r, 900));
    const modalHidden = wa.document.getElementById('signModal').classList.contains('hidden');
    const r = wa.document.getElementById('signCanvas').getBoundingClientRect();
    const iw = wa.innerWidth, ih = wa.innerHeight;
    P('modal visible: ' + !modalHidden);
    P(`canvas ${Math.round(r.width)}x${Math.round(r.height)} vs viewport ${iw}x${ih}`);
    P('canvas nearly full width: ' + (r.width >= iw * 0.9));
    P('canvas fills most height: ' + (r.height >= ih * 0.7));
    P('canvas backing store sized: ' + (wa.document.getElementById('signCanvas').width > 0));
    wa.eval('closeSignPad(null)');
    await p;
    P('closed ok');
  } catch (e) { P('FATAL: ' + e.message); }
  P('DONE');
})();
</script>
</body>
</html>
