<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t</title></head><body>
<pre id="log">START</pre>
<script>
sessionStorage.setItem('cyc-portal-auth', JSON.stringify({p:'test',exp:Date.now()+900000}));
const log=(...a)=>{document.getElementById('log').textContent+='\n'+a.join(' ')};
window.addEventListener('message',e=>{if(e.data&&e.data.t==='log')log(e.data.m)});
const frame=document.createElement('iframe');
frame.style.cssText='width:1200px;height:900px';
document.body.appendChild(frame);
let entered=false, tested=false;
frame.addEventListener('load',()=>setTimeout(()=>onLoad(),700));
frame.src='/duties/?t='+Date.now();
async function onLoad(){
 const w=frame.contentWindow;
 try{
  const st=w.eval(`JSON.stringify({gate:!document.getElementById('gate').hidden,main:!document.querySelector('main.wrap').hidden})`);
  const s=JSON.parse(st);
  log('LOAD gate='+s.gate+' main='+s.main);
  if(s.gate&&!entered){entered=true;w.eval(`document.querySelector('[data-dorm="hau"]').click();document.getElementById('gateEnterBtn').click()`);return}
  if(s.main&&!tested){tested=true;runTests(w)}
 }catch(e){log('ERR '+e)}
}
function runTests(w){
 w.eval(`(async()=>{
 const say=(...a)=>parent.postMessage({t:'log',m:a.join(' ')},'*');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 try{
  window.requestAnimationFrame=cb=>setTimeout(()=>cb(performance.now()),16);
  window.matchMedia=q=>({matches:true,media:q,onchange:null,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){},dispatchEvent(){return false}});
  for(let i=0;i<200&&configSync.busy;i++)await sleep(100);
  await sleep(1500);
  for(let i=0;i<200&&configSync.busy;i++)await sleep(100);
  say('settled. residents='+RESIDENTS.length+' jobs='+JOBS.length+' cloudLoaded='+cloud.loaded+' records='+allRecords().length+' ver='+APP_VERSION);
  // ---- Bug 2: wheel pointer vs winner ----
  window.__caps=[];
  const _re=revealEntry;
  window.revealEntry=function(e){
   try{__caps.push({id:e.id,tf:document.getElementById('wheel').style.transform,order:wheelPeopleOrder().slice()})}catch(err){__caps.push({err:String(err)})}
   return _re(e);
  };
  async function waitBusy(){for(let i=0;i<300&&busy;i++)await sleep(100)}
  for(let k=0;k<3;k++){
   document.getElementById('drawBtn').click();await waitBusy();await sleep(200);
   say('draw'+(k+1)+' last='+(state.round&&state.round.last)+' busy='+busy);
  }
  document.getElementById('wheelShuffle').click();await sleep(300);
  document.getElementById('drawBtn').click();await waitBusy();await sleep(200);
  say('draw4 (post-shuffle) last='+(state.round&&state.round.last));
  __caps.forEach((cap,ci)=>{
   if(cap.err){say('cap'+ci+' ERR '+cap.err);return}
   const deg=parseFloat(/rotate\\(([-\\d.]+)deg\\)/.exec(cap.tf)[1]);
   const n=cap.order.length,step=360/n;
   const topIdx=Math.min(n-1,Math.floor((((-deg)%360)+360)%360/step));
   const idx=cap.order.indexOf(cap.id);
   say('cap'+ci+': winner='+cap.id+' idx='+idx+' topIdx='+topIdx+' match='+(topIdx===idx));
  });
  // hold check: wheel should stay at landing position after draw
  const held=document.getElementById('wheel').style.transform;
  const lastCap=__caps[__caps.length-1];
  say('hold: transform after settle ='+held+' equals landing='+(held===lastCap.tf));
  // ---- Bug 1: avoid repeat (能避就避 + 標示) ----
  window.revealEntry=_re;
  document.getElementById('allBtn').click();await waitBusy();await sleep(300);
  const r1={};entries().forEach(e=>{r1[e.id]=JOBS[e.job].name});
  const d=new Date(state.weekStart+'T12:00:00');d.setDate(d.getDate()+7);
  const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const ws=document.getElementById('weekStart');ws.value=iso;ws.dispatchEvent(new Event('change'));
  await sleep(300);
  window.confirm=()=>true;
  document.getElementById('resetBtn').click();await sleep(300);
  const ar=document.getElementById('avoidRepeat');ar.checked=true;ar.dispatchEvent(new Event('change'));await sleep(200);
  say('avoidRepeat='+state.avoidRepeat+' lastJobsCount='+Object.keys(lastRoundJobs()).length);
  document.getElementById('allBtn').click();await waitBusy();await sleep(300);
  const flagCount=entries().filter(e=>e.repeat).length;
  say('round2 repeats='+JSON.stringify(state.round.repeats)+' flagCount='+flagCount+' match='+(state.round.repeats.length===flagCount));
  say('notice hidden='+document.getElementById('repeatNotice').hidden+' text='+document.getElementById('repeatNotice').textContent);
  say('badges in DOM='+document.querySelectorAll('#jobList .auto-reason').length+' (同上週: '+[...document.querySelectorAll('#jobList .auto-reason')].filter(x=>x.textContent==='同上週').length+')');
  // unit: infeasible + feasible
  const u=assignAvoiding([1,2,3],[0,0,1],{1:JOBS[0].name,2:JOBS[0].name,3:JOBS[0].name});
  say('unit infeasible: entries='+u.entries.length+' repeats='+u.repeats.length+' (expect 3/2)');
  const u2=assignAvoiding([1,2,3],[0,0,1],{1:JOBS[0].name});
  say('unit feasible: repeats='+u2.repeats.length+' jobs='+JSON.stringify(u2.entries.map(x=>[x.id,x.job])));
 }catch(e){say('TEST ERR '+(e&&e.stack||e))}
 parent.postMessage({t:'log',m:'DONE'},'*');
 })()`);
}
</script></body></html>
