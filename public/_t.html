<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t</title></head><body>
<pre id="log">START</pre>
<script>
sessionStorage.setItem('cyc-portal-auth', JSON.stringify({p:'test',exp:Date.now()+900000}));
const log=(...a)=>{document.getElementById('log').textContent+='\n'+a.join(' ')};
window.addEventListener('message',e=>{if(e.data&&e.data.t==='log')log(e.data.m)});
const frame=document.createElement('iframe');
frame.style.cssText='width:1200px;height:900px';
document.body.appendChild(frame);
let entered=false, tested=false;
frame.addEventListener('load',()=>setTimeout(()=>onLoad(),700));
frame.src='/duties/?t='+Date.now();
async function onLoad(){
 const w=frame.contentWindow;
 try{
  const st=w.eval(`JSON.stringify({gate:!document.getElementById('gate').hidden,main:!document.querySelector('main.wrap').hidden})`);
  const s=JSON.parse(st);
  log('LOAD gate='+s.gate+' main='+s.main);
  if(s.gate&&!entered){entered=true;w.eval(`document.querySelector('[data-dorm="hau"]').click();document.getElementById('gateEnterBtn').click()`);return}
  if(s.main&&!tested){tested=true;runTests(w)}
 }catch(e){log('ERR '+e)}
}
function runTests(w){
 w.eval(`(async()=>{
 const say=(...a)=>parent.postMessage({t:'log',m:a.join(' ')},'*');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 try{
  window.requestAnimationFrame=cb=>setTimeout(()=>cb(performance.now()),16);
  window.matchMedia=q=>({matches:true,media:q,onchange:null,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){},dispatchEvent(){return false}});
  say('ua='+navigator.userAgent.slice(0,40));
  for(let i=0;i<200&&configSync.busy;i++)await sleep(100);
  await sleep(1500);
  for(let i=0;i<200&&configSync.busy;i++)await sleep(100);
  say('config settled. residents='+RESIDENTS.length+' jobs='+JOBS.length+' cloudLoaded='+cloud.loaded+' records='+allRecords().length+' ready='+ready()+' problem='+staffingProblem()+' drawDisabled='+document.getElementById('drawBtn').disabled);
  // ---- Bug 2: wheel pointer vs winner ----
  const pal=['#e7f2db','#fff5c4','#b7dccc','#f3d777','#d9e9e1','#f0e8c9'].map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
  window.__caps=[];
  const _re=revealEntry;
  window.revealEntry=function(e){
   try{
    const cv=document.getElementById('wheel'),cx=cv.getContext('2d');
    const tf=cv.style.transform,order=wheelPeopleOrder().slice();
    let votes={};
    for(const off of [-28,-16,-6,0,6,16,28]){
     const x=Math.round(400+320*Math.sin(off*Math.PI/180)),y=Math.round(400-320*Math.cos(off*Math.PI/180));
     const d=cx.getImageData(x,y,1,1).data;let best=-1,bd=1e9;
     pal.forEach((p,pi)=>{const dd=(p[0]-d[0])**2+(p[1]-d[1])**2+(p[2]-d[2])**2;if(dd<bd){bd=dd;best=pi}});
     if(bd<3600)votes[best]=(votes[best]||0)+1;
    }
    const palIdx=Object.entries(votes).sort((a,b)=>b[1]-a[1])[0];
    __caps.push({id:e.id,tf,order,palIdx:palIdx?Number(palIdx[0]):-1,palVotes:palIdx?palIdx[1]:0});
   }catch(err){__caps.push({err:String(err)})}
   return _re(e);
  };
  async function waitBusy(){for(let i=0;i<300&&busy;i++)await sleep(100)}
  for(let k=0;k<3;k++){
   document.getElementById('drawBtn').click();await waitBusy();await sleep(200);
   say('draw'+(k+1)+' done last='+(state.round&&state.round.last)+' busy='+busy);
  }
  document.getElementById('wheelShuffle').click();await sleep(300);
  say('shuffled wheel order');
  document.getElementById('drawBtn').click();await waitBusy();await sleep(200);
  say('draw4 (post-shuffle) done last='+(state.round&&state.round.last));
  // verify caps
  __caps.forEach((cap,ci)=>{
   if(cap.err){say('cap'+ci+' ERR '+cap.err);return}
   const m=/rotate\\(([-\\d.]+)deg\\)/.exec(cap.tf);const deg=parseFloat(m[1]);
   const n=cap.order.length,step=360/n;
   const mod=(360+((-deg)%360))%360;
   const topIdx=Math.min(n-1,Math.floor(mod/step));
   const idx=cap.order.indexOf(cap.id);
   say('cap'+ci+': winner='+cap.id+' idx='+idx+' topIdx='+topIdx+' deg='+deg.toFixed(1)+' match='+(topIdx===idx)+' palIdx='+cap.palIdx+' expectPal='+(topIdx%6)+' palOk='+(cap.palIdx===topIdx%6)+' votes='+cap.palVotes);
  });
  // ---- Bug 1: avoid repeat ----
  window.revealEntry=_re;
  document.getElementById('allBtn').click();await waitBusy();await sleep(300);
  say('round1 revealed='+revealed().length+' complete='+isComplete());
  const r1={};entries().forEach(e=>{r1[e.id]=JOBS[e.job].name});
  const d=new Date(state.weekStart+'T12:00:00');d.setDate(d.getDate()+7);
  const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const ws=document.getElementById('weekStart');ws.value=iso;ws.dispatchEvent(new Event('change'));
  await sleep(300);
  window.confirm=()=>true;
  document.getElementById('resetBtn').click();await sleep(300);
  say('after reset: round='+state.round+' records='+allRecords().length+' cloudLoaded='+cloud.loaded);
  const ar=document.getElementById('avoidRepeat');ar.checked=true;ar.dispatchEvent(new Event('change'));await sleep(200);
  const lj=lastRoundJobs();
  say('avoidRepeat='+state.avoidRepeat+' lastJobsCount='+Object.keys(lj).length);
  document.getElementById('allBtn').click();await waitBusy();await sleep(300);
  const repeats=entries().filter(e=>r1[e.id]&&r1[e.id]===JOBS[e.job].name).map(e=>({id:e.id,job:JOBS[e.job].name}));
  say('round2 revealed='+revealed().length+' repeatFallback='+(state.round&&state.round.repeatFallback));
  say('REPEATS='+JSON.stringify(repeats));
  // unit: assignAvoiding infeasible case
  const u=assignAvoiding([1,2,3],[0,0,1],{1:JOBS[0].name,2:JOBS[0].name,3:JOBS[0].name});
  say('unit infeasible result='+(u===null?'null':JSON.stringify(u)));
  const u2=assignAvoiding([1,2,3],[0,0,1],{1:JOBS[0].name});
  say('unit feasible result='+(u2===null?'null':JSON.stringify(u2.map(x=>[x.id,x.job]))));
 }catch(e){say('TEST ERR '+(e&&e.stack||e))}
 parent.postMessage({t:'log',m:'DONE'},'*');
 })()`);
}
</script></body></html>
