<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>duties e2e</title></head>
<body><pre id="log">RUNNING
</pre>
<script>
const log=m=>{document.getElementById('log').textContent+=m+'\n'};
const pass=m=>log('PASS: '+m),fail=m=>log('FAIL: '+m);
const KEYS=['dorm-duty-dorm','dorm-duty-unlocked','dorm-duty-passcode','dorm-duty-offline','dorm-duty-auth-exp','cyc-portal-auth'];
const clearKeys=()=>KEYS.forEach(k=>sessionStorage.removeItem(k));
function loadFrame(url){return new Promise((res,rej)=>{const f=document.createElement('iframe');f.style.cssText='width:1200px;height:800px';f.onload=()=>setTimeout(()=>res(f),300);f.onerror=rej;f.src=url;document.body.appendChild(f)})}
function waitReload(f){return new Promise(res=>{f.onload=()=>setTimeout(res,400)})}
const rm=f=>f.remove();
(async()=>{
try{
 // T1 無登入 → 閘頁、冇直通提示
 clearKeys();
 let f=await loadFrame('/duties/?cb=t1');
 let w=f.contentWindow,d=f.contentDocument;
 if(w.eval("$('gate').hidden"))fail('T1 gate 應顯示');else pass('T1 無登入時顯示閘頁');
 if((d.querySelector('.gate-note')||{}).textContent?.includes('已經由入口頁登入'))fail('T1 不應有直通提示');else pass('T1 無直通提示');
 rm(f);

 // T2 經入口頁 sessionStorage 直通
 clearKeys();
 sessionStorage.setItem('cyc-portal-auth',JSON.stringify({p:'testpass',exp:Date.now()+15*60*1000}));
 f=await loadFrame('/duties/?cb=t2');
 w=f.contentWindow;d=f.contentDocument;
 if(!w.eval("typeof dutyAuthValid==='function'"))fail('T2 dutyAuthValid 未定義');
 else if(!w.eval("dutyAuthValid()"))fail('T2 dutyAuthValid 應為 true');else pass('T2 讀取入口頁登入有效');
 if(!(d.querySelector('.gate-note')||{}).textContent?.includes('已經由入口頁登入'))fail('T2 應有直通提示');else pass('T2 閘頁顯示直通提示');

 // T3 點選孝社 → 直接入 app
 const reloaded=waitReload(f);
 d.querySelector('[data-dorm="hau"]').click();
 await reloaded;
 w=f.contentWindow;d=f.contentDocument;
 if(w.eval("$('gate').hidden"))pass('T3 點社後直接進入 app（免密碼）');else fail('T3 仍停留閘頁');
 if(w.eval("DORM_ID")==='hau')pass('T3 DORM_ID=hau');else fail('T3 DORM_ID='+w.eval("DORM_ID"));

 // T4 記錄列印
 let printed=false;w.print=()=>{printed=true};
 w.eval(`window.__rec={id:'duty-test',dorm:'hau',title:'測試記錄',savedAt:new Date().toISOString(),reason:'manual',snapshot:{...clone(state),config:configuration()}};printRecordSheet(window.__rec)`);
 if(!printed)fail('T4 未觸發 print()');else pass('T4 print() 已觸發');
 if(d.body.classList.contains('printing-record'))pass('T4 printing-record 已加上');else fail('T4 缺 printing-record class');
 const pr=w.eval("$('printRecord').innerHTML");
 if(pr.includes('測試記錄')&&pr.includes('當值導師'))pass('T4 列印內容正確');else fail('T4 列印內容不正確');
 w.dispatchEvent(new w.Event('afterprint'));
 if(!d.body.classList.contains('printing-record'))pass('T4 afterprint 移除 class');else fail('T4 afterprint 未移除 class');
 if(d.getElementById('historyPrintBtn')&&d.getElementById('gatePrintBtn'))pass('T4 兩個列印掣存在');else fail('T4 列印掣缺失');
 rm(f);

 // T5 hash 傳密碼
 clearKeys();
 f=await loadFrame('/duties/?cb=t5#key=hashpass&t='+Date.now());
 w=f.contentWindow;
 if(w.eval("dutyAuthValid()"))pass('T5 hash 登入有效');else fail('T5 hash 登入無效');
 if(!w.location.hash)pass('T5 hash 已清除');else fail('T5 hash 未清除: '+w.location.hash);
 if(w.sessionStorage.getItem('dorm-duty-passcode')==='hashpass')pass('T5 密碼已存入');else fail('T5 密碼未存入');
 rm(f);

 // T6 過期 hash
 clearKeys();
 f=await loadFrame('/duties/?cb=t6#key=old&t='+(Date.now()-20*60*1000));
 w=f.contentWindow;d=f.contentDocument;
 if(!w.eval("dutyAuthValid()"))pass('T6 過期 hash 已拒絕');else fail('T6 過期 hash 竟然有效');
 if(w.eval("$('gate').hidden"))fail('T6 應停留閘頁');else pass('T6 停留閘頁');
 rm(f);
 clearKeys();
}catch(e){fail('異常: '+(e&&e.message||e))}
log('DONE');
})();
</script></body></html>
