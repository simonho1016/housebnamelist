<!doctype html><meta charset="utf-8"><title>t</title>
<pre id="log"></pre>
<iframe id="w" style="width:1200px;height:800px"></iframe>
<script>
const log = m => document.getElementById('log').textContent += m + '\n';
const w = document.getElementById('w');
const load = src => new Promise(r => { w.onload = () => setTimeout(r, 400); w.src = src; });
(async () => {
  try {
    // T1 入口頁：已登入 → 三張卡
    await load('/');
    w.contentWindow.sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'x', exp: Date.now() + 900000 }));
    await load('/');
    let d = w.contentDocument;
    const cards = [...d.querySelectorAll('.card')].map(c => c.dataset.url + '|' + c.querySelector('.card-name').textContent.trim());
    log('T1 cards=' + JSON.stringify(cards));
    log('T1 mainViewHidden=' + d.getElementById('mainView').hidden);

    // T2 無 auth 入 /apply/ → 彈返入口頁
    w.contentWindow.sessionStorage.removeItem('cyc-portal-auth');
    await load('/apply/');
    log('T2 path=' + w.contentWindow.location.pathname);

    // T3 有 auth（hash 帶入）→ 職員登入畫面
    await load('/apply/#key=x&t=' + Date.now());
    d = w.contentDocument;
    log('T3 path=' + w.contentWindow.location.pathname);
    log('T3 loginVisible=' + !d.getElementById('sLoginScreen').classList.contains('hidden'));
    log('T3 staffOptions=' + (d.getElementById('s_name').options.length - 1));
    log('T3 roleHint=' + d.getElementById('roleHint').textContent);
    log('T3 portalBtn=' + (d.querySelector('header button[onclick]') || {}).textContent);
    log('T3 homeBtnHidden=' + d.getElementById('homeBtn').classList.contains('hidden'));

    // T4 函數存在 + 設定頁結構
    const ev = s => w.contentWindow.eval(s);
    log('T4 validateForm=' + ev('typeof validateForm'));
    log('T4 renderPDF=' + ev('typeof renderPDF'));
    log('T4 archiveFileName=' + ev("archiveFileName({house:'忠社',payeeId:'A01',payee:'陳大文',date:'2026-09-16',no:'2026-001'})"));
    log('T4 memberRow=' + (ev('memberRow({id:"A01",name:"測試",notion:"X1"})').includes('data-f="notion"')));
    log('T4 entryPwGone=' + (d.getElementById('setEntryPw') === null));
    log('T4 v120=' + d.body.textContent.includes('v1.2.0'));

    // T5 職員登入 → f_archive 掣
    ev('sessionStorage.setItem("cyc-portal-auth", JSON.stringify({p:"x",exp:Date.now()+900000}))');
    d.getElementById('s_name').value = d.getElementById('s_name').options[1].value;
    d.getElementById('s_pw').value = '0001';
    d.getElementById('s_login_btn').click();
    await new Promise(r => setTimeout(r, 600));
    log('T5 formVisible=' + !d.getElementById('sFormScreen').classList.contains('hidden'));
    log('T5 archiveBtn=' + ((d.getElementById('f_archive') || {}).textContent || 'MISSING'));
    log('T5 homeBtnVisible=' + !d.getElementById('homeBtn').classList.contains('hidden'));
  } catch (e) { log('ERR ' + e.message); }
  log('DONE');
})();
</script>
