<!doctype html><meta charset="utf-8"><title>t</title>
<pre id="log"></pre>
<iframe id="w" style="width:1200px;height:800px"></iframe>
<script>
const log = m => document.getElementById('log').textContent += m + '\n';
const w = document.getElementById('w');
const load = src => new Promise(r => { w.onload = () => setTimeout(r, 400); w.src = src; });
(async () => {
  try {
    await load('/');
    w.contentWindow.sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'x', exp: Date.now() + 900000 }));
    await load('/apply/');
    const d = w.contentDocument;
    const ev = s => w.contentWindow.eval(s);
    // T1 Notion 功能已移除
    log('T1 f_notionGone=' + (d.getElementById('f_notion') === null));
    log('T1 p_notionGone=' + (d.getElementById('p_notion') === null));
    log('T1 syncBtnGone=' + (d.getElementById('notionSyncBtn') === null));
    log('T1 memberRowNoNotion=' + !ev('memberRow({id:"B14",name:"吳培燊"})').includes('notion'));
    // T2 檔名格式
    log('T2 fname=' + ev("archiveFileName({house:'孝社',payeeId:'B14',payee:'吳培燊',date:'2026-09-16'})"));
    log('T2 fnameOther=' + ev("archiveFileName({house:'忠社',payeeId:'',payee:'陳大文',date:'2026-09-16'})"));
    // T3 Drive 函數存在
    log('T3 driveUpload=' + ev('typeof driveUpload'));
    log('T3 getDriveToken=' + ev('typeof getDriveToken'));
    log('T3 driveFolder=' + ev('typeof driveFolder'));
    // T4 設定頁有 Google Drive 卡
    d.getElementById('goSettings').click();
    d.getElementById('s_name').value = d.getElementById('s_name').options[1].value;
    d.getElementById('s_pw').value = '0001';
    d.getElementById('s_login_btn').click();
    await new Promise(r => setTimeout(r, 800));
    log('T4 settingsVisible=' + !d.getElementById('settingsScreen').classList.contains('hidden'));
    log('T4 gdriveInput=' + (d.getElementById('gdriveClientId') !== null));
    log('T4 saveGdriveBtn=' + (d.getElementById('saveGdriveBtn') !== null));
    log('T4 notionCols=' + d.querySelectorAll('#setMembers [data-f="notion"]').length);
    log('T4 v122=' + d.body.textContent.includes('v1.2.2'));
    // T5 未設 Client ID 時嘅錯誤訊息
    ev('window.__alerts=[]; window.alert=m=>window.__alerts.push(m)');
    const msg = await ev('getDriveToken().then(()=>"NO_ERROR").catch(e=>e.message)');
    log('T5 noClientId=' + msg);
  } catch (e) { log('ERR ' + e.message); }
  log('DONE');
})();
</script>
