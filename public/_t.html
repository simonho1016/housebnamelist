<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>portal e2e 3</title></head>
<body><pre id="log">RUNNING
</pre>
<script>
const log=m=>{document.getElementById('log').textContent+=m+'\n'};
const pass=m=>log('PASS: '+m),fail=m=>log('FAIL: '+m);
const KEYS=['dorm-duty-dorm','dorm-duty-unlocked','dorm-duty-passcode','dorm-duty-offline','dorm-duty-auth-exp','cyc-portal-auth'];
const clearKeys=()=>KEYS.forEach(k=>sessionStorage.removeItem(k));
function loadFrame(url){return new Promise((res,rej)=>{const f=document.createElement('iframe');f.style.cssText='width:1280px;height:860px';f.onload=()=>setTimeout(()=>res(f),350);f.onerror=rej;f.src=url;document.body.appendChild(f)})}
function waitReload(f){return new Promise(res=>{f.onload=()=>setTimeout(res,450)})}
const login=()=>sessionStorage.setItem('cyc-portal-auth',JSON.stringify({p:'testpass',exp:Date.now()+15*60*1000}));
(async()=>{
let f,d,w,nav;
try{
 // R1 撳卡身 → 揀社畫面，密碼欄隱藏，顯示免密碼進入掣
 clearKeys();login();
 f=await loadFrame('/?cb=r1');
 d=f.contentDocument;
 nav=waitReload(f);
 d.querySelector('.card-duty').click();
 await nav;
 w=f.contentWindow;d=f.contentDocument;
 if(!w.eval("$('gate').hidden"))pass('R1 顯示揀社畫面');else fail('R1 直入咗抽籤頁');
 const lbl=d.getElementById('gatePass')?.closest('label');
 if(lbl&&lbl.hidden)pass('R1 密碼欄已隱藏');else fail('R1 密碼欄仍顯示');
 if(d.getElementById('gateEnterBtn').textContent.includes('免密碼'))pass('R1 顯示免密碼進入掣');else fail('R1 進入掣未變: '+d.getElementById('gateEnterBtn').textContent);

 // R2 撳「忠」→ 顯示記錄面板（未入 app）
 d.querySelector('[data-dorm="chung"]').click();
 await new Promise(r=>setTimeout(r,300));
 if(!d.getElementById('gateDorm').hidden)pass('R2 揀忠社後顯示記錄面板');else fail('R2 記錄面板未開');
 if(d.getElementById('gateDormTitle').textContent.includes('忠社'))pass('R2 標題係忠社');else fail('R2 標題異常');
 if(d.getElementById('gateRecordStatus'))pass('R2 記錄區存在');else fail('R2 缺記錄區');
 if(w.eval("$('gate').hidden"))fail('R2 唔應該直入 app');else pass('R2 仍停留閘頁等撳進入');

 // R3 撳「進入抽籤系統（已登入，免密碼）」→ 直入忠社 app
 nav=waitReload(f);
 d.getElementById('gateEnterBtn').click();
 await nav;
 w=f.contentWindow;d=f.contentDocument;
 if(w.eval("$('gate').hidden")&&w.eval("DORM_ID")==='chung')pass('R3 免密碼直入忠社 app');else fail('R3 未直入');

 // R4 卡內「孝社」掣 → 閘頁預選孝社＋顯示記錄（唔再直達）
 nav=waitReload(f);
 [...d.querySelectorAll('.top-actions button')].find(b=>b.textContent.includes('返回主頁')).click();
 await nav;
 d=f.contentDocument;
 nav=waitReload(f);
 d.querySelector('.card-duty .dorm-btn[data-dorm="hau"]').click();
 await nav;
 w=f.contentWindow;d=f.contentDocument;
 if(!w.eval("$('gate').hidden"))pass('R4 卡掣都係入揀社畫面');else fail('R4 卡掣直入咗 app');
 if(!d.getElementById('gateDorm').hidden&&d.getElementById('gateDormTitle').textContent.includes('孝社'))pass('R4 已預選孝社兼顯示記錄');else fail('R4 未預選孝社');

 // R5 無登入直開 /duties/ → 密碼欄正常顯示
 f.remove();clearKeys();
 f=await loadFrame('/duties/?cb=r5');
 d=f.contentDocument;
 const lbl2=d.getElementById('gatePass')?.closest('label');
 if(lbl2&&!lbl2.hidden)pass('R5 無登入時密碼欄正常');else fail('R5 無登入密碼欄異常');
 if(!d.getElementById('gateEnterBtn').textContent.includes('免密碼'))pass('R5 無登入進入掣原文');else fail('R5 無登入掣文異常');
 f.remove();clearKeys();
}catch(e){fail('異常: '+(e&&e.message||e))}
log('DONE');
})();
</script></body></html>
