<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t</title></head><body>
<pre id="log">TEST-START</pre>
<script>
const log = m => document.getElementById('log').textContent += '\n' + m;
sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'test', exp: Date.now() + 900000 }));
const f1 = document.createElement('iframe');
f1.src = '/apply/';
f1.style.cssText = 'width:1200px;height:900px';
document.body.appendChild(f1);
f1.addEventListener('load', async () => {
  await new Promise(r => setTimeout(r, 3000));
  const w = f1.contentWindow;
  try {
    await w.document.fonts.ready;
    log('BODY-FONT: ' + w.getComputedStyle(w.document.body).fontFamily.slice(0, 60));
    const doc = w.document.querySelector('.doc');
    log('DOC-FONT: ' + (doc ? w.getComputedStyle(doc).fontFamily.slice(0, 60) : 'NO-DOC'));
    log('HUNINN-LOADED: ' + w.document.fonts.check('16px Huninn'));
    const btn = w.document.querySelector('button');
    log('BTN-FONT: ' + w.getComputedStyle(btn).fontFamily.slice(0, 60));
  } catch (e) { log('ERR ' + e.message); }
  log('TEST-END');
});
</script>
</body></html>
