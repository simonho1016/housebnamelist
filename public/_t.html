<!doctype html><meta charset="utf-8"><title>t</title>
<pre id="log"></pre>
<iframe id="w" style="width:1200px;height:900px"></iframe>
<script>
const log = m => document.getElementById('log').textContent += m + '\n';
const w = document.getElementById('w');
const load = src => new Promise(r => { w.onload = () => setTimeout(r, 500); w.src = src; });
const sleep = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  try {
    await load('/');
    w.contentWindow.sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'x', exp: Date.now() + 900000 }));
    // T1 入口頁四張卡
    await load('/');
    let d = w.contentDocument;
    const cards = [...d.querySelectorAll('.card')].map(c => c.dataset.url + '|' + c.querySelector('.card-name').textContent.trim());
    log('T1 cards=' + JSON.stringify(cards));
    // T2 後台密碼閘
    await load('/admin/');
    d = w.contentDocument;
    const ev = s => w.contentWindow.eval(s);
    ev('window.__alerts=[]; window.alert=m=>window.__alerts.push(m)');
    log('T2 gateShown=' + !d.getElementById('gateScreen').classList.contains('hidden'));
    // 錯密碼
    d.getElementById('gate_pw').value = '0000';
    d.getElementById('gate_btn').click();
    await sleep(800);
    log('T2 wrongPw=' + d.getElementById('gate_err').textContent);
    // 預設密碼 8888
    d.getElementById('gate_pw').value = '8888';
    d.getElementById('gate_btn').click();
    await sleep(2500);
    log('T2 mainShown=' + !d.getElementById('mainScreen').classList.contains('hidden'));
    // T3 數據總覽
    log('T3 total=' + d.getElementById('sum_total').textContent + ' / ' + d.getElementById('sum_count').textContent);
    log('T3 zhong=' + d.getElementById('sum_zhong').textContent);
    log('T3 xiao=' + d.getElementById('sum_xiao').textContent);
    log('T3 unsettled=' + d.getElementById('sum_unsettled').textContent);
    log('T3 byPayee=' + d.getElementById('by_payee').textContent.includes('測試舍友'));
    log('T3 byCat=' + d.getElementById('by_cat').textContent.includes('車費'));
    log('T3 recShown=' + d.getElementById('rec_list').textContent.includes('TEST-ADMIN'));
    // T4 結算欄位未開通嘅降級提示
    log('T4 warn=' + d.getElementById('rec_list').textContent.includes('結算欄位未開通'));
    // 全選 → 結算掣 → 應彈 SQL 提示
    d.getElementById('sel_all').click();
    await sleep(200);
    log('T4 settleBtn=' + d.getElementById('settle_btn').textContent);
    d.getElementById('settle_btn').click();
    await sleep(300);
    log('T4 alert=' + JSON.stringify(ev('window.__alerts')));
    // T5 篩選功能
    d.getElementById('q_house').value = '孝社';
    d.getElementById('q_go').click();
    await sleep(1500);
    log('T5 xiaoFilter=' + d.getElementById('sum_count').textContent);
    d.getElementById('q_reset').click();
    await sleep(1500);
    log('T5 reset=' + d.getElementById('sum_count').textContent);
  } catch (e) { log('ERR ' + e.message); }
  log('DONE');
})();
</script>
