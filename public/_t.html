<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t</title></head><body>
<pre id="log">TEST-START</pre>
<script>
const log = m => document.getElementById('log').textContent += '\n' + m;
const sleep = ms => new Promise(r => setTimeout(r, ms));
sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'test', exp: Date.now() + 900000 }));
const f1 = document.createElement('iframe');
f1.src = '/apply/';
f1.style.cssText = 'width:1200px;height:900px';
document.body.appendChild(f1);
f1.addEventListener('load', async () => {
  await sleep(2500);
  const w = f1.contentWindow;
  try {
    log('BUCKET: ' + w.eval('ARCHIVE_BUCKET'));
    log('PATH-TEST: ' + w.eval('archivePath({house:"忠社",payeeId:"B14",payee:"陳大文"}, "B14_20260917.pdf")'));
    log('HAS-UPLOAD-FN: ' + (typeof w.eval('storageUpload')));
    log('HAS-SIGNED-FN: ' + (typeof w.eval('storageSignedUrl')));
    log('HAS-REMOVE-FN: ' + (typeof w.eval('storageRemove')));
    log('GDRIVE-GONE: ' + (w.eval('typeof driveUpload') === 'undefined' && w.eval('typeof getDriveToken') === 'undefined'));
    const scripts = [...w.document.querySelectorAll('script[src]')].map(s => s.src);
    log('NO-GOOGLE-SCRIPT: ' + !scripts.some(s => s.includes('accounts.google.com')));
    log('SETTINGS-NO-GDRIVE-INPUT: ' + !w.document.getElementById('gdriveClientId'));
    log('VER-126: ' + w.document.body.innerHTML.includes('v1.2.6'));
    // 試上傳（預期 bucket 未建會失敗，但要有清晰提示）
    try {
      await w.eval('storageUpload(new Blob(["x"],{type:"application/pdf"}), "test/probe.pdf")');
      log('UPLOAD-PROBE: success（bucket 已存在）');
    } catch (e) {
      log('UPLOAD-PROBE-MSG: ' + e.message);
    }
  } catch (e) { log('ERR ' + e.message); }
  log('TEST-END');
});
setTimeout(() => log('TIMEOUT'), 15000);
</script>
</body></html>
