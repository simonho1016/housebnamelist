<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t2</title></head><body>
<pre id="log">START</pre>
<script>
const log=(...a)=>{document.getElementById('log').textContent+='\n'+a.join(' ')};
const f=document.createElement('iframe');f.style.cssText='width:1100px;height:800px';document.body.appendChild(f);
f.onload=()=>setTimeout(()=>{
 try{
  const w=f.contentWindow,d=w.document;
  log('title='+d.title);
  log('chooser shown='+!d.getElementById('chooser').hidden);
  const auth=d.getElementById('auth');
  log('authDlg open='+auth.open);
  log('directToggle exists='+(!!d.getElementById('authDirectToggle'))+' authInput exists='+(!!d.getElementById('authInput')));
  log('portalBtn exists='+(!!d.getElementById('authPortal'))+' text='+(d.getElementById('authPortal')||{}).textContent);
  log('authMsg='+(d.getElementById('authMsg')||{}).textContent);
 }catch(e){log('ERR '+(e&&e.stack||e))}
 log('DONE');
},1500);
f.src='/roster/?house=xiao&t='+Date.now();
</script></body></html>
