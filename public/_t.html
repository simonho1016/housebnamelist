<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>e2e</title></head>
<body>
<pre id="log">running…</pre>
<script>
const log = [];
const P = m => { log.push(m); document.getElementById('log').textContent = log.join('\n'); };
sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'test', exp: Date.now() + 900000 }));
function loadFrame(src){
  return new Promise(res => {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:1200px;height:800px;';
    f.src = src;
    f.onload = () => setTimeout(() => res(f), 2500);
    document.body.appendChild(f);
  });
}
(async () => {
  try {
    // ===== /apply/ =====
    const fa = await loadFrame('/apply/');
    const wa = fa.contentWindow;
    P('== APPLY ==');
    P('f_safepay checkbox: ' + !!wa.document.getElementById('f_safepay'));
    P('signScale removed: ' + !wa.document.getElementById('signScale'));
    P('p_safepay span: ' + !!wa.document.getElementById('p_safepay'));
    P('helpers: ' + ['getSafeVault','checkSafePay','deductSafe','houseKey'].map(n => n + '=' + (typeof wa.eval(n))).join(', '));
    const vault = await wa.eval('getSafeVault()');
    P('getSafeVault -> ' + JSON.stringify(vault));
    // 簽名板新 layout：modal 存在、冇滑桿 label
    const modal = wa.document.getElementById('signModal');
    P('signModal exists: ' + !!modal);
    P('sign canvas container aspect: ' + (modal && modal.innerHTML.includes('aspect-ratio:16/7') || modal && !!modal.querySelector('[style*="aspect-ratio"]')));
    // fillSheet 測試：safePay 顯示
    try {
      wa.eval(`fillSheet({house:'忠社',payee:'測試',payeeId:'T00',amount:'1.00',cats:['零食'],catOther:'',remark:'',staff:'測試員',dateStr:'2026-09-17 12:00',serial:'2026-9999',docNo:'',notionId:'',payeeSign:null,safePay:true})`);
      P('fillSheet safePay=true -> ' + wa.document.getElementById('p_safepay').textContent);
      wa.eval(`fillSheet({house:'忠社',payee:'測試',payeeId:'T00',amount:'1.00',cats:['零食'],catOther:'',remark:'',staff:'測試員',dateStr:'2026-09-17 12:00',serial:'2026-9998',docNo:'',notionId:'',payeeSign:null,safePay:false})`);
      P('fillSheet safePay=false -> ' + wa.document.getElementById('p_safepay').textContent);
    } catch (e) { P('fillSheet ERR: ' + e.message); }

    // ===== /admin/ =====
    const fb = await loadFrame('/admin/');
    const wb = fb.contentWindow;
    P('== ADMIN ==');
    const pw = await wb.eval('getAdminPw()');
    wb.document.getElementById('gate_pw').value = pw;
    wb.document.getElementById('gate_btn').click();
    await new Promise(r => setTimeout(r, 4000));
    P('mainScreen visible: ' + !wb.document.getElementById('mainScreen').classList.contains('hidden'));
    ['vault_big','vault_zhong','vault_xiao','vault_save','vault_xfer_amt','vault_xfer_house','vault_xfer','vault_check','member_bal_list','member_bal_save','member_bal_total']
      .forEach(id => P(id + ': ' + !!wb.document.getElementById(id)));
    P('vault_check text: ' + wb.document.getElementById('vault_check').textContent);
    P('member_bal_total text: ' + wb.document.getElementById('member_bal_total').textContent);
    P('member inputs: ' + wb.document.querySelectorAll('.mbal_in').length);
    P('helpers: ' + ['getSafeVault','saveSafeVault','getSettingValue','renderVault','houseKey'].map(n => n + '=' + (typeof wb.eval(n))).join(', '));
    // 結算檢查邏輯：假設 vault 已 init 且唔夠錢 → settle_btn 應該擋（模擬）
    P('settle_btn is async fn: ' + String(wb.document.getElementById('settle_btn') !== null));
    // CSV head 有「夾萬支付」
    P('csv safe col: ' + (wb.document.querySelector('script') ? 'n/a' : 'n/a'));
  } catch (e) {
    P('FATAL: ' + e.message);
  }
  P('DONE');
})();
</script>
</body>
</html>
