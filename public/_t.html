<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>t</title></head><body>
<pre id="log">TEST-START</pre>
<script>
const log = m => document.getElementById('log').textContent += '\n' + m;
const sleep = ms => new Promise(r => setTimeout(r, ms));
sessionStorage.setItem('cyc-portal-auth', JSON.stringify({ p: 'test', exp: Date.now() + 900000 }));
const f1 = document.createElement('iframe');
f1.src = '/admin/';
f1.style.cssText = 'width:1200px;height:900px';
document.body.appendChild(f1);
f1.addEventListener('load', async () => {
  await sleep(2500);
  const w = f1.contentWindow;
  try {
    log('PDFLIB-LOADED: ' + !!w.PDFLib);
    log('HAS-PRINT-BTN: ' + !!w.document.getElementById('print_btn'));
    const pw = await w.eval('getAdminPw()');
    w.document.getElementById('gate_pw').value = pw;
    w.document.getElementById('gate_btn').click();
    await sleep(3500);
    const rows = w.eval('rows');
    const withPdf = rows.filter(r => r.pdf_path);
    log('PDF-RECORDS: ' + withPdf.length);
    if (withPdf.length) {
      const cb = w.document.querySelector(`.sel_rec[data-id="${withPdf[0].id}"]`);
      cb.checked = true;
      cb.dispatchEvent(new w.Event('change', { bubbles: true }));
      await sleep(200);
      log('PRINT-ENABLED: ' + !w.document.getElementById('print_btn').disabled);
      log('PRINT-TEXT: ' + w.document.getElementById('print_btn').textContent);
      // 實測合併邏輯（唔彈列印，只驗證 merge 出幾多頁）
      const pages = await w.eval(`(async () => {
        const merged = await PDFLib.PDFDocument.create();
        const { data, error } = await sb.storage.from('apply-archive').download('${withPdf[0].pdf_path}');
        if (error) return 'DL-ERR:' + error.message;
        const src = await PDFLib.PDFDocument.load(await data.arrayBuffer(), { ignoreEncryption: true });
        const ps = await merged.copyPages(src, src.getPageIndices());
        ps.forEach(p => merged.addPage(p));
        const bytes = await merged.save();
        return 'MERGED-PAGES:' + merged.getPageCount() + ' SIZE:' + bytes.length;
      })()`);
      log('MERGE-TEST: ' + pages);
    }
  } catch (e) { log('ERR ' + e.message); }
  log('TEST-END');
});
setTimeout(() => log('TIMEOUT'), 20000);
</script>
</body></html>
